# fly.toml — Fly.io configuration for Agentic RAG Backend
# Replace "agentic-rag-backend" with your actual app name after running `fly launch`

app = "agentic-rag-backend"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CHROMA_DB_DIR = "/data/chroma_db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume — ChromaDB data survives restarts and redeploys
[[mounts]]
  source = "chroma_data"
  destination = "/data/chroma_db"
  initial_size = "1gb"
